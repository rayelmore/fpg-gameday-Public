<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FPG App — Member FAQ</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --green:      #1a7a3c;
    --green-dark: #0f4d25;
    --green-mid:  #22a050;
    --gold:       #c9a227;
    --gold-light: #f0c84a;
    --cream:      #f5f0e8;
    --dark:       #0d1a12;
    --gray:       #1e2e22;
    --gray-mid:   #2a3a2f;
    --white:      #ffffff;
    --text-dim:   #7a9a82;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Barlow', sans-serif;
    background: var(--dark);
    color: var(--cream);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── NOISE TEXTURE OVERLAY ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.4;
  }

  /* ── HEADER ── */
  header {
    position: relative;
    z-index: 1;
    padding: 48px 40px 36px;
    border-bottom: 1px solid rgba(201,162,39,0.2);
    background: linear-gradient(160deg, #0f4d25 0%, var(--dark) 55%);
    overflow: hidden;
  }

  header::after {
    content: '';
    position: absolute;
    bottom: -1px; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  /* Decorative ring */
  .ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(201,162,39,0.12);
    pointer-events: none;
  }
  .ring-1 { width: 340px; height: 340px; top: -120px; right: -80px; }
  .ring-2 { width: 200px; height: 200px; top: -40px;  right: 40px; }

  .header-eyebrow {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 10px;
  }

  header h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(42px, 8vw, 72px);
    line-height: 0.95;
    letter-spacing: 1px;
    color: var(--white);
    margin-bottom: 14px;
  }

  header h1 em {
    color: var(--gold);
    font-style: normal;
  }

  .header-sub {
    font-size: 15px;
    font-weight: 300;
    color: var(--text-dim);
    max-width: 480px;
    line-height: 1.6;
  }

  .faq-count {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 20px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-dim);
    border: 1px solid var(--gray-mid);
    padding: 6px 14px;
  }
  .faq-count span { color: var(--gold); font-size: 16px; }

  /* ── MAIN ── */
  main {
    position: relative;
    z-index: 1;
    max-width: 820px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  /* ── FAQ ITEM ── */
  .faq-item {
    border-bottom: 1px solid rgba(255,255,255,0.06);
    overflow: hidden;
    transition: background 0.25s;
  }
  .faq-item:first-child { border-top: 1px solid rgba(255,255,255,0.06); }

  .faq-trigger {
    display: flex;
    align-items: center;
    gap: 18px;
    width: 100%;
    background: none;
    border: none;
    cursor: pointer;
    padding: 22px 4px;
    text-align: left;
    position: relative;
  }

  .faq-num {
    flex-shrink: 0;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 13px;
    letter-spacing: 1px;
    color: rgba(201,162,39,0.35);
    width: 28px;
    line-height: 1;
    transition: color 0.25s;
  }

  .faq-question {
    flex: 1;
    font-family: 'Barlow', sans-serif;
    font-size: 16px;
    font-weight: 600;
    color: var(--cream);
    line-height: 1.4;
    transition: color 0.25s;
  }

  .faq-icon {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 1px solid var(--gray-mid);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
    position: relative;
  }

  .faq-icon::before,
  .faq-icon::after {
    content: '';
    position: absolute;
    background: var(--text-dim);
    border-radius: 2px;
    transition: all 0.3s;
  }
  .faq-icon::before { width: 10px; height: 1.5px; }
  .faq-icon::after  { width: 1.5px; height: 10px; }

  /* ── ANSWER PANEL ── */
  .faq-body {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 0.35s cubic-bezier(0.4,0,0.2,1);
  }
  .faq-body-inner {
    overflow: hidden;
  }
  .faq-answer {
    display: flex;
    gap: 18px;
    padding: 0 4px 24px 46px;
  }
  .faq-answer-bar {
    flex-shrink: 0;
    width: 3px;
    background: linear-gradient(to bottom, var(--gold), transparent);
    border-radius: 2px;
    min-height: 100%;
  }
  .faq-answer-text {
    font-size: 14.5px;
    font-weight: 400;
    color: #a5c5ad;
    line-height: 1.75;
  }
  .faq-answer-text strong {
    color: var(--cream);
    font-weight: 600;
  }
  .faq-answer-text em {
    color: var(--gold);
    font-style: normal;
    font-weight: 500;
  }

  /* ── OPEN STATE ── */
  .faq-item.open .faq-body {
    grid-template-rows: 1fr;
  }
  .faq-item.open .faq-num {
    color: var(--gold);
  }
  .faq-item.open .faq-question {
    color: var(--white);
  }
  .faq-item.open .faq-icon {
    background: var(--gold);
    border-color: var(--gold);
  }
  .faq-item.open .faq-icon::before {
    background: var(--dark);
  }
  .faq-item.open .faq-icon::after {
    background: var(--dark);
    transform: rotate(90deg) scaleY(0);
  }
  .faq-item.open .faq-trigger {
    padding-bottom: 14px;
  }

  /* ── HOVER ── */
  .faq-trigger:hover .faq-question { color: var(--white); }
  .faq-trigger:hover .faq-icon { border-color: var(--gold); }
  .faq-trigger:hover .faq-icon::before,
  .faq-trigger:hover .faq-icon::after { background: var(--gold); }

  /* ── FOOTER ── */
  footer {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 24px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #2a4030;
    border-top: 1px solid rgba(255,255,255,0.05);
  }

  /* ── ANIMATIONS ── */
  .faq-item {
    opacity: 0;
    transform: translateY(12px);
    animation: slideIn 0.4s ease forwards;
  }
  @keyframes slideIn {
    to { opacity: 1; transform: translateY(0); }
  }
  .faq-item:nth-child(1)  { animation-delay: 0.05s; }
  .faq-item:nth-child(2)  { animation-delay: 0.10s; }
  .faq-item:nth-child(3)  { animation-delay: 0.15s; }
  .faq-item:nth-child(4)  { animation-delay: 0.20s; }
  .faq-item:nth-child(5)  { animation-delay: 0.25s; }
  .faq-item:nth-child(6)  { animation-delay: 0.30s; }
  .faq-item:nth-child(7)  { animation-delay: 0.35s; }
  .faq-item:nth-child(8)  { animation-delay: 0.40s; }
  .faq-item:nth-child(9)  { animation-delay: 0.45s; }
  .faq-item:nth-child(10) { animation-delay: 0.50s; }

  @media (max-width: 600px) {
    header { padding: 36px 20px 28px; }
    main { padding: 28px 16px 60px; }
    .faq-question { font-size: 15px; }
    .faq-answer { padding-left: 36px; }
  }
</style>
</head>
<body>

<header>
  <div class="ring ring-1"></div>
  <div class="ring ring-2"></div>
  <div class="header-eyebrow">Florida Players Group · Member Resource</div>
  <h1>FPG App<br><em>FAQ</em></h1>
  <p class="header-sub">Everything you need to know about the app, the decision ahead, and what it means for your game day experience.</p>
  <div class="faq-count"><span>10</span> Questions · Spring 2026</div>
</header>

<main>
  <div class="faq-list" id="faqList"></div>
</main>

<footer>Florida Players Group · Confidential — Members Only · Spring 2026</footer>

<script>
const faqs = [
  {
    q: "What exactly is the FPG App?",
    a: "The FPG App is a <strong>custom-built web application</strong> designed exclusively for the Florida Players Group. It was built specifically around how <em>we</em> play — our formats, our games, our workflows. It handles everything from the moment you sign up for a round to the moment your payout hits your Zelle. No other app on the market does all of that in one place for a group like ours."
  },
  {
    q: "What does the app actually do during a typical week?",
    a: "From sign-up to payout, the app manages: <strong>member check-in and registration</strong>, blind draw pairings, live Stableford/Quota scoring, real-time leaderboard updates, automatic Champion of the Day calculation, skins tracking (hole by hole), Closest to Pin entry, Blind Draw and Blind Squirrel selection, and a full payout summary with each winner's Zelle or Cash App displayed. It also syncs everything to Google Sheets and generates a PDF payout report — all in one session."
  },
  {
    q: "Why is this decision coming up now?",
    a: "The app was built and has been maintained by <strong>TMac</strong> — and it isn't free to run. Hosting, infrastructure, and development costs add up to approximately <em>$1,800 per year</em>. We've reached a point where the group needs to collectively decide whether we want to fund it, go back to the manual way, or find an alternative. This is a responsible, transparent conversation — and every member deserves a voice in it."
  },
  {
    q: "What are the three options on the table?",
    a: "<strong>Option A — Adopt & Pay:</strong> The group shares the cost of the app. Zero disruption, everything stays exactly as it is.<br><br><strong>Option B — Retire the App:</strong> We go back to paper scorecards, spreadsheet payouts, and WhatsApp sign-ups. It worked before — it just means more manual work for everyone, especially the organizer and game coordinator.<br><br><strong>Option C — Find a Replacement:</strong> We research and migrate to a more affordable or free alternative. Requires transition time and no guarantee the replacement handles all our formats."
  },
  {
    q: "If we adopt the app, how much would each member pay?",
    a: "Based on <strong>25 active members</strong> sharing the $1,800 annual cost equally, the math comes out to <em>$72 per member per year</em> — that's <strong>$6 per month</strong>, or roughly $1.44 per round if you play all 50 weeks. That's less than a sleeve of golf balls. Other funding models are also on the table, including a small per-round add-on to the existing buy-in, which would bring the weekly cost to around $3 per player."
  },
  {
    q: "Did we look at other apps? Is there anything free or cheaper?",
    a: "Yes — five alternatives were researched and compared: <strong>Squabbit, Golfify, TheGrint, Golf GameBook, and x4Golf</strong>. The most affordable is x4Golf at $55/yr for unlimited players. Squabbit is completely free. <em>However — not one of them</em> includes Blind Draw, automated payout calculation, and payment tracking. Those are core to how FPG runs every week. Switching would mean handling all of that manually again, every single game day."
  },
  {
    q: "What happens if we go back to the old manual way?",
    a: "It's doable — we did it before the app existed. But it means: <strong>paper scorecards</strong> on course, <strong>manual spreadsheet math</strong> for Quota and skins after each round, <strong>WhatsApp sign-up management</strong> each week, <strong>no live leaderboard</strong> during play, and significantly more post-round work for the organizer and game coordinator to settle payouts. If the group votes this way, we'll have a clear plan to make the transition smooth."
  },
  {
    q: "How will the vote work? Will anyone see how I voted?",
    a: "<strong>No — your vote is completely private.</strong> Each active member will receive a personal link via WhatsApp DM (not in the group chat). The link opens a Google Form with the three options. Your individual choice is anonymous — only the final tally will be shared with the group. One vote per member. The voting window will have a set deadline, and results will be announced to everyone at the same time with full transparency."
  },
  {
    q: "Who counts as an 'active member' eligible to vote?",
    a: "An active member is anyone who has <strong>participated in FPG rounds recently</strong> — generally defined as playing at least a couple of rounds in the past few months. If you've been showing up and teeing it up, you have a vote. If you have any question about your eligibility, reach out to Sting Ray directly before the voting deadline."
  },
  {
    q: "When is the decision being made and how do I stay informed?",
    a: "The official <strong>FPG App Decision Meeting</strong> is scheduled for <em>Tuesday, June 9th at 7:00 PM</em> via Zoom. The full presentation — including the app deep dive, the alternatives comparison, and the voting instructions — will be shared with the group beforehand so you can review everything at your own pace. After the vote closes, the result will be announced to the full group and we will implement the decision immediately. Whatever we decide, <strong>we move forward together.</strong>"
  }
];

const list = document.getElementById('faqList');

faqs.forEach((faq, i) => {
  const item = document.createElement('div');
  item.className = 'faq-item';
  item.innerHTML = `
    <button class="faq-trigger" aria-expanded="false" aria-controls="faq-body-${i}">
      <span class="faq-num">${String(i+1).padStart(2,'0')}</span>
      <span class="faq-question">${faq.q}</span>
      <span class="faq-icon" aria-hidden="true"></span>
    </button>
    <div class="faq-body" id="faq-body-${i}" role="region">
      <div class="faq-body-inner">
        <div class="faq-answer">
          <div class="faq-answer-bar"></div>
          <div class="faq-answer-text">${faq.a}</div>
        </div>
      </div>
    </div>
  `;

  const trigger = item.querySelector('.faq-trigger');
  trigger.addEventListener('click', () => {
    const isOpen = item.classList.contains('open');
    // close all
    document.querySelectorAll('.faq-item.open').forEach(el => {
      el.classList.remove('open');
      el.querySelector('.faq-trigger').setAttribute('aria-expanded','false');
    });
    if (!isOpen) {
      item.classList.add('open');
      trigger.setAttribute('aria-expanded','true');
    }
  });

  list.appendChild(item);
});
</script>
</body>
</html>
